<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aiva — AI Python Assistant</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .shell { width: min(980px, 100%); height: min(760px, 92vh); display: grid; grid-template-rows: auto 1fr auto; background: white; border: 1px solid #dfe5ef; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(23,32,51,.10); }
    header { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e8ecf2; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo { width: 42px; height: 42px; display:grid; place-items:center; border-radius: 13px; background:#172033; color:#fff; font-weight:800; }
    h1 { margin: 0; font-size: 18px; } .sub { color:#6d7687; font-size:12px; margin-top:3px; }
    #status { font-size:12px; color:#697386; }
    #chat { overflow:auto; padding: 22px; display:flex; flex-direction:column; gap:14px; }
    .msg { max-width: 78%; padding: 12px 15px; border-radius: 16px; white-space:pre-wrap; line-height:1.45; font-size:14px; }
    .user { align-self:flex-end; background:#172033; color:#fff; border-bottom-right-radius:5px; }
    .assistant { align-self:flex-start; background:#f0f3f8; color:#172033; border-bottom-left-radius:5px; }
    .welcome { max-width: 600px; padding: 24px; background:#f7f8fb; border:1px solid #e7ebf2; border-radius:18px; align-self:center; text-align:center; color:#596579; }
    form { border-top:1px solid #e8ecf2; padding:14px; display:grid; grid-template-columns:auto 1fr auto; gap:10px; }
    input { width:100%; border:1px solid #dce2eb; border-radius:14px; padding:13px 14px; font-size:14px; outline:none; }
    input:focus { border-color:#172033; box-shadow:0 0 0 3px rgba(23,32,51,.08); }
    button { border:0; border-radius:14px; padding:0 16px; min-height:46px; cursor:pointer; font-weight:700; }
    .icon { width:46px; padding:0; background:#eef1f6; color:#172033; }
    #send { background:#172033; color:#fff; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .recording { outline:3px solid rgba(220,53,69,.18); background:#ffe9ec; color:#a51d2d; }
    .hint { text-align:center; color:#8992a3; font-size:11px; padding:0 10px 10px; }
    @media (max-width: 650px) { .shell { height: 94vh; border-radius: 16px; } .msg { max-width:90%; } form { grid-template-columns:auto 1fr auto; } }
    .msg.assistant a {
    color: #315A9B;
    text-decoration: underline;
}

.msg.assistant a:hover {
    opacity: 0.75;
}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="logo">A</div>
        <div><h1>Aiva</h1><div class="sub">AI Python Assistant</div></div>
      </div>
      <div id="status">Checking service…</div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome">Hi, I’m Aiva. Ask me anything, or use the microphone to speak your request.</div>
    </section>

    <div>
      <form id="form">
        <button id="mic" class="icon" type="button" title="Speak">🎙</button>
        <input id="input" autocomplete="off" placeholder="Ask Aiva anything…" maxlength="12000" />
        <button id="send" type="submit">Send</button>
      </form>
      <div class="hint">Voice input uses your browser microphone permissions. AI responses are generated by the Python backend using Google Gemini.</div>
    </div>
  </main>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const mic = document.getElementById('mic');
const statusEl = document.getElementById('status');
const history = [];

function addMessage(role, content) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;

    if (role === 'assistant') {
        const urlRegex = /(https?:\/\/[^\s<]+)/g;

        const parts = content.split(urlRegex);

        parts.forEach((part) => {
            if (urlRegex.test(part)) {
                const link = document.createElement('a');
                link.href = part.replace(/[.,)\]]+$/, '');
                link.textContent = part.replace(/[.,)\]]+$/, '');
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.style.color = '#315A9B';
                link.style.textDecoration = 'underline';

                el.appendChild(link);
            } else {
                el.appendChild(document.createTextNode(part));
            }
        });
    } else {
        el.textContent = content;
    }

    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
}

async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const data = await r.json();
    statusEl.textContent = data.ai_configured ? `Online · ${data.model}` : 'Backend online · Gemini key missing';
  } catch { statusEl.textContent = 'Backend unavailable'; }
}

async function sendMessage(text) {
  const clean = text.trim();
  if (!clean) return;
  addMessage('user', clean);
  history.push({role:'user', content:clean});
  input.value = '';
  send.disabled = true;
  statusEl.textContent = 'Thinking…';
  try {
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history.slice(-20)})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Request failed');
    addMessage('assistant', data.reply);
    history.push({role:'assistant', content:data.reply});
    speak(data.reply);
  } catch (err) {
    addMessage('assistant', `Sorry — ${err.message}`);
  } finally {
    send.disabled = false;
    await checkHealth();
    input.focus();
  }
}

form.addEventListener('submit', e => { e.preventDefault(); sendMessage(input.value); });

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = () => { mic.classList.add('recording'); statusEl.textContent = 'Listening…'; };
  recognition.onend = async () => { mic.classList.remove('recording'); await checkHealth(); };
  recognition.onerror = (e) => { mic.classList.remove('recording'); statusEl.textContent = `Voice error: ${e.error}`; };
  recognition.onresult = e => { input.value = e.results[0][0].transcript; input.focus(); };
  mic.addEventListener('click', () => { try { recognition.start(); } catch {} });
} else {
  mic.disabled = true;
  mic.title = 'Voice input is not supported by this browser';
}

checkHealth();
</script>
</body>
</html>
